name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: |
          mkdir dist
          cp target/release/ascii-shader dist/
          cp README.md LICENSE dist/
          tar -czf ascii-shader-${{ matrix.name }}.tar.gz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: ascii-shader-${{ matrix.name }}.tar.gz
