[package]
name = "ascii-shader"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal renderer that draws 3D scenes with lines and marks and does not flicker"
readme = "README.md"
exclude = ["docs/", "out/"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fontdue = "0.9.5"
glam = "0.34.1"
png = "0.18.1"
rayon = "1.12.0"

[profile.release]
opt-level = 3
debug = 1
